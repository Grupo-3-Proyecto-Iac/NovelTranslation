storage:
  base_directory: data/novels

language:
  source: en
  target: es

access:
  timeout:
    connect_seconds: 10
    read_seconds: 30
    write_seconds: 30
    pool_seconds: 10

  concurrency: 1
  delay:
    min_seconds: 8
    max_seconds: 15
  requests_per_minute: 4

  follow_redirects: true
  max_response_size_mb: 10

  headers:
    User-Agent: "NovelTranslator/0.1"
    Accept: "text/html,application/xhtml+xml,text/plain"
    Accept-Language: "en-US,en;q=0.9"

retry:
  max_attempts: 3
  base_delay_seconds: 30
  max_delay_seconds: 300
  backoff_factor: 2
  max_retry_after_seconds: 300

download:
  on_chapter_error: stop
  skip_existing: true
  refresh_metadata: true

processing:
  chunking:
    max_characters: 2200
    target_characters: 1700
    overlap_paragraphs: 0

analysis:
  context:
    previous_chunks: 1
    include_glossary: true
    include_entities: true

translation:
  provider: mock
  source_language: en
  target_language: es
  model: qwen2.5:7b
  huggingface_model: Helsinki-NLP/opus-mt-en-es
  huggingface_device: cpu
  context:
    previous_chunks: 1
  behavior:
    preserve_locked_terms: true
    skip_existing: true
  output:
    translation_id: default
  retry:
    max_attempts: 2

memory:
  enabled: true
  translation:
    max_entries_per_request: 20
    exact_match: true
  context:
    previous_chapters: 2
    max_items: 20
  conflict_policy: warn

validation:
  enabled: true
  auto_validate_after_translation: true
  length_ratio:
    min: 0.35
    max: 2.50
  untranslated_detection:
    enabled: true
    warning_threshold: 0.30
  locked_terms:
    missing_is_failure: true

