[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noveltranslator"
version = "0.1.0"
description = "Arquitectura modular para adquirir, analizar y traducir novelas web."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "NovelTranslator contributors" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
huggingface = ["transformers>=4.40", "torch>=2.2"]
browser = ["playwright>=1.40"]
audio = ["supertonic==1.3.1", "onnxruntime>=1.18", "numpy>=1.26"]

[project.scripts]
noveltranslator = "noveltranslator.cli.commands:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

